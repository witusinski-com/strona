#lista { width: 30%; overflow-y: scroll; padding: 15px; border-right: 2px solid #ccc; }

iframe { width: 100%; height: 100%; border: 0; }
button { margin-top: 10px; padding: 10px; font-size: 16px; cursor: pointer; }
h2 { margin-top: 20px; border-bottom: 1px solid #aaa; }
a { display: block; margin: 3px 0; color: #0066cc; cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
#quiz { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }

// Generowanie listy pogrupowanej po typach
const listaDiv = document.getElementById('miejscaLista');
const kategorie = ["Cieśnina", "Zatoka", "Morze", "Jezioro", "Rzeka"];

kategorie.forEach(kat => {
  const h2 = document.createElement('h2');
  h2.textContent = kat + "s";
  listaDiv.appendChild(h2);
  
  const podlista = miejsca.filter(m => m.typ === kat);
  podlista.forEach(m => {
    const a = document.createElement('a');
    a.textContent = m.nazwa;
    a.onclick = () => pokazMiejsce(m.nazwa);
    listaDiv.appendChild(a);
  });
});

// Funkcja do pokazywania miejsca na mapie z typem
function pokazMiejsce(miejsceNazwa) {
  const miejsceObj = miejsca.find(m => m.nazwa === miejsceNazwa);
  if(miejsceObj) {
    const wyszukiwarka = `${miejsceObj.nazwa} ${miejsceObj.typ}`;
    document.getElementById("mapaFrame").src = "https://www.google.com/maps?q=" + encodeURIComponent(wyszukiwarka) + "&output=embed";
  }
}

// Tryb nauki
let wylosowane = null;
function losujMiejsce() {
  const indeks = Math.floor(Math.random() * miejsca.length);
  wylosowane = miejsca[indeks];
  document.getElementById("wylosowane").textContent = "Zgadnij miejsce: " + wylosowane.typ;
  document.getElementById("wynik").textContent = "";
}

function pokazOdpowiedz() {
  if(wylosowane) {
    document.getElementById("wynik").textContent = "To miejsce to: " + wylosowane.nazwa;
    pokazMiejsce(wylosowane.nazwa);
  }
}
