// Sortowanie i generowanie listy
function sortAlfabetycznie(lista) { return lista.sort((a,b)=>a.nazwa.localeCompare(b.nazwa, 'pl')); }

const miejscaPosortowane = [
  ...sortAlfabetycznie(miejsca),
  ...sortAlfabetycznie(zatoki),
  ...sortAlfabetycznie(morza),
  ...sortAlfabetycznie(jeziora),
  ...sortAlfabetycznie(rzeki)
];

const listaDiv = document.getElementById('miejscaLista');
["Cieśnina","Zatoka","Morze","Jezioro","Rzeka"].forEach(typ => {
  const naglowek = document.createElement('h3');
  naglowek.textContent = typ;
  listaDiv.appendChild(naglowek);

  miejscaPosortowane.filter(m => m.typ===typ).forEach(m => {
    const a = document.createElement('a');
    a.textContent = m.nazwa;
    a.onclick = ()=>pokazMiejsce(m);
    listaDiv.appendChild(a);
  });
});

// Funkcja mapy z mapowaniem niestandardowych nazw
function pokazMiejsce(m) {
  const mapowanie = {
    "Białe": "White Sea",
    "Tajwańska": "Taiwan Strait"
  };
  let nazwaDoWyszukania = mapowanie[m.nazwa] || m.nazwa;
  let wyszukiwanie = `${nazwaDoWyszukania} ${m.typ}`;

  // Podmieniamy <img> na <iframe>
  const mapaDiv = document.getElementById("mapa");
  mapaDiv.innerHTML = `<iframe src="https://www.google.com/maps?q=${encodeURIComponent(wyszukiwanie)}&output=embed" loading="lazy"></iframe>`;
}


// Tryb nauki
let wylosowane = null;
function losujMiejsce() {
  const indeks = Math.floor(Math.random()*miejscaPosortowane.length);
  wylosowane = miejscaPosortowane[indeks];
  document.getElementById("wylosowane").textContent = `Zgadnij miejsce: ${wylosowane.nazwa} (${wylosowane.typ})`;
  document.getElementById("wynik").textContent = "";
}

function pokazOdpowiedz() {
  if(wylosowane){
    document.getElementById("wynik").textContent = `To miejsce to: ${wylosowane.nazwa} (${wylosowane.typ})`;
    pokazMiejsce(wylosowane);
  }
}
